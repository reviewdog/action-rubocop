name: Test rdjson_formatter
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ruby/setup-ruby@v1.335.0
        with:
          ruby-version: '3.4'
      - run: gem install rubocop
      - name: Test rdjson_formatter
        run: ./test/rdjson_formatter/test.sh
